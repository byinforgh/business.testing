function stock(){const rem=me==="Herbal Dispensary"?"remedy":"food";return `<div class="card scroll"><b>Inventory</b><table><tr><th>Product</th><th>In stock</th><th>Reorder at</th><th>Status</th><th></th></tr>${PROD.filter(p=>p[3]===rem).map(p=>{const q=S.stock[p[0]];return `<tr><td>${p[2]} ${p[1]}</td><td>${q}</td><td>${p[6]}</td><td>${q<=p[6]?`<span class="tag r">Low</span>`:`<span class="tag">OK</span>`}</td><td><button class="sm" onclick="S.stock['${p[0]}']+=20;note('Overview','Restocked ${p[1]}');save();render()">+20</button></td></tr>`}).join("")}</table></div>`}
function bars(d){const mx=Math.max(1,...d.map(x=>x[1])),w=300/d.length;return `<svg viewBox="0 0 300 125" width="100%">${d.map((x,i)=>{const h=x[1]/mx*80;return `<rect x="${i*w+5}" y="${95-h}" width="${w-10}" height="${h}" rx="3" fill="var(--pr)"/><text x="${i*w+w/2}" y="${90-h}" text-anchor="middle" font-size="10" fill="var(--tx)">${x[1]}</text><text x="${i*w+w/2}" y="112" text-anchor="middle" font-size="8.5" fill="var(--mu)">${x[0]}</text>`}).join("")}</svg>`}
function overview(){const I=S.items,day=864e5,td=I.filter(i=>Date.now()-i.t<day),dn=I.filter(i=>i.done),avg=dn.length?Math.round(dn.reduce((s,i)=>s+(i.done-i.t),0)/dn.length/6e4):0,rev=I.filter(i=>i.paid).reduce((s,i)=>s+i.total,0),ph={};I.forEach(i=>ph[i.phone]=(ph[i.phone]||0)+1);const cl=Object.values(ph),ret=Math.round(cl.filter(x=>x>1).length/cl.length*100);
const days=[...Array(7)].map((_,k)=>{const d=iso(Date.now()-(6-k)*day);return[dt(Date.now()-(6-k)*day),I.filter(i=>iso(i.t)===d).length]}),
byD=DEPTS.map(d=>[SH[d],I.filter(i=>i.dept===d).length]),byT=[["Check-in",I.filter(i=>i.type==="checkin").length],["Booking",I.filter(i=>i.type==="book").length],["Order",I.filter(i=>i.type==="order").length]],
revD=DEPTS.map(d=>[SH[d],Math.round(I.filter(i=>i.dept===d&&i.paid).reduce((s,i)=>s+i.total,0))]),hrs=[...Array(10)].map((_,k)=>[pad(8+k),I.filter(i=>new Date(i.arr||i.t).getHours()===8+k).length]),avgD=DEPTS.map(d=>{const x=I.filter(i=>i.dept===d&&i.done);return[SH[d],x.length?Math.round(x.reduce((s,i)=>s+(i.done-(i.arr||i.t)),0)/x.length/6e4):0]}),today=iso(Date.now()),tdy=DEPTS.map(d=>{const a=I.filter(i=>i.type==="book"&&(i.cdept||i.dept)===d&&i.date===today&&i.status!=="cancelled");return[d,a.length,a.filter(i=>i.status==="booked").length,H(d).from,H(d).to]});
const feed=I.flatMap(i=>i.log.map(l=>[l[1],l[0],l[2],i.name])).sort((a,b)=>b[0]-a[0]).slice(0,8),low=PROD.filter(p=>S.stock[p[0]]<=p[6]),wait=I.filter(i=>i.status==="new"&&Date.now()-(i.arr||i.t)>6e5);
return `<div class="row" style="margin:0 0 10px"><button onclick="sim()">⚡ Simulate incoming client</button><button onclick="if(confirm('Reset all demo data?')){S=seed();save();render()}">Reset demo data</button></div>
<div class="g4"><div class="kpi"><b>${td.length}</b><span>Requests (24h)</span></div><div class="kpi"><b>${I.filter(i=>["new","progress"].includes(i.status)).length}</b><span>Open right now</span></div><div class="kpi"><b>${GH(rev)}</b><span>Revenue collected</span></div><div class="kpi"><b>${avg} min</b><span>Avg time to complete</span></div></div>
<div class="g4" style="margin-top:12px"><div class="kpi"><b>${cl.length}</b><span>Clients on record</span></div><div class="kpi"><b>${ret}%</b><span>Returning clients</span></div><div class="kpi"><b style="color:var(--rd)">${wait.length}</b><span>Waiting over 10 min</span></div><div class="kpi"><b style="color:var(--rd)">${low.length}</b><span>Low-stock items</span></div></div>
<div class="g2"><div class="card"><b>Requests, last 7 days</b>${bars(days)}</div><div class="card"><b>Load by department</b>${bars(byD)}</div><div class="card"><b>Request types</b>${bars(byT)}</div><div class="card"><b>Revenue by department (GH₵)</b>${bars(revD)}</div><div class="card"><b>Peak hours (all requests)</b>${bars(hrs)}</div><div class="card"><b>Average time in centre by department (min)</b>${bars(avgD)}</div><div class="card scroll"><b>Today’s appointments by department</b><table><tr><th>Dept</th><th>Booked</th><th>Still expected</th><th>Open hours</th></tr>${tdy.map(r=>`<tr><td>${r[0]}</td><td>${r[1]}</td><td>${r[2]}</td><td>${hh(r[3])}–${hh(r[4])}</td></tr>`).join("")}</table></div></div>
<div class="g2"><div class="card"><b>Live activity</b>${feed.map(f=>`<div class="meta">${tm(f[0])} · <b>${esc(f[1])}</b> · ${esc(f[2])} · ${esc(f[3])}</div>`).join("")}</div>
<div class="card"><b>Attention needed</b>${low.map(p=>`<div class="meta">📦 ${p[1]}: ${S.stock[p[0]]} left</div>`).join("")}${wait.map(i=>`<div class="meta">⏱ ${esc(i.name)} waiting ${Math.round((Date.now()-(i.arr||i.t))/6e4)} min at ${i.dept}</div>`).join("")}${!low.length&&!wait.length?`<div class="meta">Nothing urgent.</div>`:""}</div></div>
<div class="g2"><div class="card" style="margin-top:0"></div>${chat()}</div>`}
