<style>
/* Layout: left nav + content on desktop, scrolling tab strip on phones. Role switch (Reseller / Admin) in the top bar. */
:root{
  --bg:#f3f5f7; --surface:#ffffff; --surface-2:#eaeef2; --line:#dce2e8;
  --fg:#0e1a26; --muted:#5b6b7b; --accent:#0b6e5c; --accent-fg:#ffffff; --accent-soft:#dff2ec;
  --gold:#d9930d; --gold-soft:#fbefd3;
  --good:#16794a; --good-soft:#dcf3e5; --warn:#a46a00; --warn-soft:#fbefd3;
  --bad:#b3261e; --bad-soft:#fbe3e0; --info:#1d5fa8; --info-soft:#dfeaf8;
  --font-display:'Space Grotesk',system-ui,sans-serif; --font-body:'Inter',system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0c141c; --surface:#131e29; --surface-2:#1a2733; --line:#263544;
  --fg:#e7edf3; --muted:#92a3b4; --accent:#3cc4a6; --accent-fg:#06231c; --accent-soft:#12372f;
  --gold:#f0b43a; --gold-soft:#3a2d10;
  --good:#58d08c; --good-soft:#12301f; --warn:#f0b43a; --warn-soft:#3a2d10;
  --bad:#ff8a80; --bad-soft:#40201d; --info:#79b2ee; --info-soft:#152b45; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0c141c; --surface:#131e29; --surface-2:#1a2733; --line:#263544;
  --fg:#e7edf3; --muted:#92a3b4; --accent:#3cc4a6; --accent-fg:#06231c; --accent-soft:#12372f;
  --gold:#f0b43a; --gold-soft:#3a2d10;
  --good:#58d08c; --good-soft:#12301f; --warn:#f0b43a; --warn-soft:#3a2d10;
  --bad:#ff8a80; --bad-soft:#40201d; --info:#79b2ee; --info-soft:#152b45; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font:14px/1.5 var(--font-body);
  padding-block:0;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

.shell{max-width:1180px;margin:0 auto}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding-block:14px}

.mark svg{width:18px;height:18px}

.seg{display:inline-flex;background:var(--surface-2);border-radius:10px;padding:3px;gap:2px}
.seg button{border:0;background:transparent;padding:7px 14px;border-radius:8px;cursor:pointer;font-weight:500;color:var(--muted)}

.layout{display:grid;grid-template-columns:200px minmax(0,1fr);gap:24px;align-items:start;padding-bottom:48px}
nav.side{display:flex;flex-direction:column;gap:2px;position:sticky;top:12px}
nav.side button{display:flex;justify-content:space-between;align-items:center;text-align:left;border:0;background:transparent;padding:9px 12px;border-radius:9px;cursor:pointer;color:var(--muted);font-weight:500}
nav.side button:hover{background:var(--surface-2);color:var(--fg)}
nav.side button[aria-current="page"]{background:var(--accent-soft);color:var(--accent)}
.badge{background:var(--gold);color:#201400;border-radius:999px;font-size:11px;font-weight:600;padding:1px 7px}
main{min-width:0;display:flex;flex-direction:column;gap:20px}
.head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}

.kpi.hero .l,.kpi.hero .s{color:inherit;opacity:.8}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;min-width:0}

.tablewrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:640px}
th{font-size:11.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);text-align:left;font-weight:600;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:10px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
td.r,th.r{text-align:right}
.sub{display:block;font-size:12px;color:var(--muted)}

.p-active{background:var(--good-soft);color:var(--good)}
.p-pending{background:var(--warn-soft);color:var(--warn)}
.p-paid{background:var(--good-soft);color:var(--good)}

.prod{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden;display:flex;flex-direction:column}
.thumb{height:110px;display:grid;place-items:center;font:700 34px var(--font-display);color:rgba(255,255,255,.92)}
.prod .body{padding:14px;display:flex;flex-direction:column;gap:10px;flex:1}
.prod h3{font-size:15px}
.rows{display:grid;grid-template-columns:1fr auto;gap:4px 12px;font-size:13px}
.rows span:nth-child(odd){color:var(--muted)}
.rows span:nth-child(even){text-align:right;font-weight:600;font-variant-numeric:tabular-nums}
.profit{color:var(--good)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{background:var(--surface-2);border-radius:6px;padding:2px 8px;font-size:12px;color:var(--muted)}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:auto}
form.f{display:grid;gap:14px}
.fgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
label.fl{display:flex;flex-direction:column;gap:5px;font-weight:500;font-size:13px}
label.fl small{font-weight:400;color:var(--muted)}
input,select,textarea{background:var(--bg);border:1px solid var(--line);border-radius:9px;padding:9px 11px;width:100%}
.opt{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);border-radius:10px;padding:11px 12px;cursor:pointer}
.opt input{width:auto;margin-top:3px}
.opt:has(input:checked){border-color:var(--accent);background:var(--accent-soft)}
.opt b{display:block}
.opt span{color:var(--muted);font-size:12.5px}
.sumrow{display:flex;justify-content:space-between;gap:12px;padding:6px 0;border-bottom:1px dashed var(--line)}
.sumrow:last-child{border-bottom:0}
.sumrow.big{font:700 17px var(--font-display);padding-top:10px}
.note{background:var(--gold-soft);border-radius:10px;padding:10px 12px;font-size:13px;color:var(--fg)}
.flow{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:12.5px;color:var(--muted)}
.flow i{font-style:normal;opacity:.5}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tabs button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;cursor:pointer;font-weight:500;font-size:13px}
.tabs button[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.bars{display:flex;align-items:flex-end;gap:6px;height:120px;padding-top:8px}
.bars div{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:4px;height:100%;font-size:11px;color:var(--muted)}
.bars span.b{width:100%;background:var(--accent);border-radius:4px 4px 0 0;min-height:2px}
.bars span.b.today{background:var(--gold)}
.track{display:flex;flex-direction:column;gap:10px}
.mod{display:flex;gap:12px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--line)}
.mod:last-child{border-bottom:0}
.mod input{width:18px;height:18px;margin-top:2px;accent-color:var(--accent)}
.mod b{display:block}
.mod span{color:var(--muted);font-size:13px}
.bar{height:8px;background:var(--surface-2);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:500;z-index:20;box-shadow:0 6px 24px rgba(0,0,0,.25);max-width:calc(100% - 32px)}
.empty{color:var(--muted);padding:18px;text-align:center}
.demo{font-size:12px;color:var(--muted);text-align:center;padding:8px 0 24px}
@media (max-width:820px){
  .layout{grid-template-columns:minmax(0,1fr);gap:14px}
  nav.side{flex-direction:row;overflow-x:auto;position:static;gap:6px;padding-bottom:4px}
  nav.side button{white-space:nowrap;gap:8px;background:var(--surface);border:1px solid var(--line)}
  .two{grid-template-columns:minmax(0,1fr)}
  .head h1{font-size:22px}
}
@media (prefers-reduced-motion:no-preference){.toast{animation:up .2s ease-out}@keyframes up{from{opacity:0;transform:translate(-50%,8px)}}}

.p-new{background:var(--warn-soft);color:var(--warn)}
.p-cancelled,.p-paused{background:var(--surface-2);color:var(--muted)}
.flow .step{display:inline-flex;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:3px 12px 3px 4px;color:var(--fg);font-weight:500}
.flow .step b{width:20px;height:20px;border-radius:50%;background:var(--accent);color:var(--accent-fg);display:grid;place-items:center;font-size:11px}
.step-n{width:26px;height:26px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-weight:700;flex:none;font-size:13px}
.leads{grid-template-columns:repeat(auto-fill,minmax(310px,1fr))}
.lead{display:flex;flex-direction:column;gap:12px}
.lead.late{border-color:var(--bad)}
.chk{display:flex;gap:8px;align-items:center;font-size:13px}.chk input{width:auto}
.flow i{display:none}
</style>

<script>
/* ---------- data ---------- */
const FEE = 50;               // commitment fee, collected by sales when they confirm
const SLA_MAX = 24;           // hours from confirmation to delivery
const NEXT_FRI = 'Fri 20 Nov', LAST_FRI = 'Fri 13 Nov';
const REGIONS = {'Greater Accra':25,'Ashanti':40,'Central':40,'Western':45,'Western North':55,'Eastern':40,'Volta':50,'Oti':55,'Bono':55,'Bono East':55,'Ahafo':55,'Northern':60,'Savannah':60,'North East':65,'Upper East':65,'Upper West':65};
const PRODUCTS = [
 {id:'p1',name:'Glow Serum Set',cat:'Skincare',price:160,comm:45,stock:240,hue:'#0b6e5c',media:'8 images · 3 videos',cap:'Glowing skin in 14 days. Order now and pay when it arrives, delivered nationwide.'},
 {id:'p2',name:'Wireless Earbuds Pro',cat:'Gadgets',price:220,comm:60,stock:96,hue:'#1d5fa8',media:'6 images · 2 videos',cap:'Crystal sound, 24hr battery. Order now, pay on delivery anywhere in Ghana.'},
 {id:'p3',name:'Smart Fitness Band',cat:'Gadgets',price:180,comm:50,stock:130,hue:'#7a4bb8',media:'5 images · 2 videos',cap:'Track steps, sleep and heart rate. Pay on delivery.'},
 {id:'p4',name:'Portable Blender',cat:'Home',price:200,comm:55,stock:58,hue:'#c2570c',media:'7 images · 4 videos',cap:'Fresh smoothies anywhere, USB rechargeable. Delivered to your door, pay on delivery.'},
 {id:'p5',name:'LED Ring Light Kit',cat:'Creators',price:170,comm:45,stock:12,hue:'#b3261e',media:'4 images · 1 video',cap:'Look great on camera. Tripod included. Pay on delivery.'},
 {id:'p6',name:'Leather Crossbody Bag',cat:'Fashion',price:260,comm:70,stock:44,hue:'#8a6a1f',media:'9 images · 2 videos',cap:'Everyday carry in genuine leather. Order today, pay on delivery.'}
];
const RESELLERS = [
 {id:'r1',name:'Kwame Asante',school:'KNUST',joined:'Sep 2026',status:'active'},
 {id:'r2',name:'Ama Serwaa',school:'UG Legon',joined:'Aug 2026',status:'active'},
 {id:'r3',name:'Yaw Mensah',school:'UCC',joined:'Oct 2026',status:'active'},
 {id:'r4',name:'Efua Boateng',school:'UEW',joined:'Nov 2026',status:'pending'}
];
const ME='r1';
let seq=1060;
const O=(rid,pid,qty,name,phone,region,city,status,ago,hrs,x={})=>({id:'TF-'+(seq++),rid,pid,qty,name,phone,region,city,address:x.addr||'',status,ago,hrs,paid:!!x.paid,wait:x.wait||0,settled:!!x.settled,tries:0});
const state={
  role:'reseller',view:'dashboard',filter:'all',sel:null,
  orders:[
   O('r1','p1',1,'Akosua Frimpong','024 412 3398','Ashanti','Kumasi','delivered',12,14,{paid:true,settled:true,addr:'Ahodwo, near the Total station'}),
   O('r1','p2',1,'Daniel Quaye','055 920 1174','Greater Accra','Accra','delivered',9,8,{paid:true,settled:true,addr:'Madina, Zongo junction'}),
   O('r1','p4',2,'Nana Adjei','020 551 7742','Greater Accra','Tema','delivered',7,11,{paid:true,settled:true,addr:'Community 8'}),
   O('r1','p3',1,'Selina Tetteh','054 310 6620','Western','Takoradi','delivered',2,19,{paid:true,addr:'Market Circle'}),
   O('r1','p1',2,'Grace Ofori','027 884 5001','Northern','Tamale','delivered',1,22,{paid:true,addr:'Lamashegu'}),
   O('r1','p6',1,'Michael Ansah','050 227 9183','Eastern','Koforidua','failed',3,16,{paid:true,addr:'Adweso'}),
   O('r1','p1',1,'Esi Mensima','024 773 6215','Central','Cape Coast','out',1,9,{paid:true,addr:'Abura'}),
   O('r1','p6',1,'Kojo Bentil','054 661 2290','Volta','Ho','confirmed',0,3,{paid:false,addr:'Ho Bankoe'}),
   O('r1','p4',1,'Linda Boakye','020 663 2287','Ashanti','Obuasi','new',0,0,{wait:12}),
   O('r1','p2',1,'Joseph Armah','055 100 4890','Bono','Sunyani','new',0,0,{wait:4}),
   O('r2','p2',2,'Abena Pokua','024 889 1155','Greater Accra','Accra','delivered',4,10,{paid:true,addr:'Osu'}),
   O('r2','p6',1,'Fiifi Quansah','027 304 8812','Central','Winneba','out',1,21,{paid:true,addr:'Winneba junction'}),
   O('r2','p1',3,'Mariam Issah','027 119 0846','Upper East','Bolgatanga','confirmed',1,26,{paid:true,addr:'Zuarungu'}),
   O('r2','p5',1,'Kwesi Darko','050 880 1172','Greater Accra','Kasoa','new',0,0,{wait:27}),
   O('r3','p4',1,'Kojo Sarpong','054 442 7731','Greater Accra','Accra','delivered',5,13,{paid:true,addr:'Dansoman'}),
   O('r3','p3',2,'Ernest Appiah','050 998 3302','Upper West','Wa','out',0,7,{paid:true,addr:'Wa Central'}),
   O('r3','p5',1,'Rita Nkansah','020 215 6678','Volta','Hohoe','failed',4,18,{paid:true,addr:'Hohoe'})
  ],
  campaigns:[
   {id:'c1',rid:'r1',pid:'p1',mode:'self',budget:0,spent:120,status:'running'},
   {id:'c2',rid:'r1',pid:'p6',mode:'managed',budget:30,spent:210,status:'running'},
   {id:'c3',rid:'r1',pid:'p2',mode:'self',budget:0,spent:45,status:'paused'},
   {id:'c4',rid:'r1',pid:'p4',mode:'self',budget:0,spent:60,status:'running'},
   {id:'c5',rid:'r1',pid:'p3',mode:'self',budget:0,spent:35,status:'running'},
   {id:'c6',rid:'r2',pid:'p2',mode:'managed',budget:40,spent:260,status:'running'},
   {id:'c7',rid:'r2',pid:'p6',mode:'self',budget:0,spent:90,status:'running'},
   {id:'c8',rid:'r3',pid:'p4',mode:'managed',budget:25,spent:0,status:'pending'}
  ],
  payouts:[]
};
const prod=id=>PRODUCTS.find(p=>p.id===id), res=id=>RESELLERS.find(r=>r.id===id);
const delFee=r=>REGIONS[r]??50;
const collect=o=>prod(o.pid).price*o.qty+delFee(o.region)-(o.paid?FEE:0);
const comm=o=>prod(o.pid).comm*o.qty;
const money=n=>'GH₵'+Number(n).toLocaleString('en-GH',{maximumFractionDigits:2});
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const STATUS={new:'New lead',confirmed:'Confirmed',out:'Out for delivery',delivered:'Delivered',failed:'Failed',cancelled:'Declined'};
const pill=s=>`<span class="pill p-${s}">${STATUS[s]||s[0].toUpperCase()+s.slice(1)}</span>`;
const OPEN=['confirmed','out'];
const dayLabel=a=>a===0?'Today':a===1?'Yesterday':a+' days ago';
const sla=o=>o.hrs>SLA_MAX?['Late','failed']:o.hrs>=18?['Due soon','pending']:['On track','active'];
const unsettled=rid=>state.orders.filter(o=>o.rid===rid&&o.status==='delivered'&&!o.settled);
const rate=l=>{const d=l.filter(o=>o.status==='delivered').length,f=l.filter(o=>o.status==='failed').length;return d+f?Math.round(d/(d+f)*100):null};
function wallet(rid){
  const mine=state.orders.filter(o=>o.rid===rid);
  const payable=unsettled(rid).reduce((s,o)=>s+comm(o),0);
  const pending=mine.filter(o=>OPEN.includes(o.status)).reduce((s,o)=>s+comm(o),0);
  const paid=state.payouts.filter(p=>p.rid===rid).reduce((s,p)=>s+p.amt,0);
  return {payable,pending,paid};
}
/* seed payout history from settled orders */
RESELLERS.forEach(r=>{const a=state.orders.filter(o=>o.rid===r.id&&o.settled).reduce((s,o)=>s+comm(o),0);if(a)state.payouts.push({id:'P-'+r.id,rid:r.id,week:LAST_FRI,amt:a,n:state.orders.filter(o=>o.rid===r.id&&o.settled).length});});

/* ---------- nav ---------- */
const NAV={
 reseller:[['dashboard','Dashboard'],['products','Products'],['campaigns','Ad campaigns'],['orders','My orders'],['earnings','Earnings'],['guide','How it works']],
 sales:[['leads','Leads'],['handled','Handled'],['guide','How it works']],

  ['Watch the Overview','Delivery within 24 hours, average delivery time and late orders tell you if the service is healthy.'],
  ['Run the Delivery board','Confirmed orders wait here. Dispatch as soon as possible. When the rider reports back, mark Delivered or Failed. Delivered credits the reseller. Failed keeps the commitment fee for logistics.'],
  ['Act on the clock','Each open order shows hours since confirmation. Due soon means 18 hours or more. Late means over 24 hours.'],
  ['Use the Ad desk','Launch ads for resellers who asked us to run them. Pause or resume when needed.'],
  ['Approve resellers','New sign-ups appear in Resellers. Approve them so they can start advertising.'],
  ['Pay every Friday','Payouts lists what each reseller is owed for delivered orders. Run the payout once the money is sent.']]}
};
function vGuide(){
  const g=GUIDE[state.role];
  return head(g.t,g.s)+flowStrip()+`<div class="panel"><div class="track">${g.steps.map((s,i)=>`<div class="mod"><div class="num step-n">${i+1}</div><div><b>${s[0]}</b><span>${s[1]}</span></div></div>`).join('')}</div></div>
  <div class="note">Delivery promise: once an order is confirmed it is delivered within 6 to 24 hours. Customers pay on delivery, nationwide.</div>`;
}

/* ---------- render ---------- */
const VIEWS={dashboard:vDashboard,products:vProducts,campaigns:vCampaigns,orders:vOrders,earnings:vEarnings,leads:vLeads,handled:vHandled,overview:vOverview,delivery:vDelivery,addesk:vAdDesk,resellers:vResellers,payouts:vPayouts,stock:vStock,guide:vGuide};
function draw(){
  ['reseller','sales','admin'].forEach(r=>document.getElementById('role-'+r).setAttribute('aria-pressed',state.role===r));
  document.getElementById('who').textContent=WHO[state.role];
  if(!NAV[state.role].some(n=>n[0]===state.view))state.view=NAV[state.role][0][0];
  document.getElementById('nav').innerHTML=NAV[state.role].map(n=>`<button data-go="${n[0]}" ${n[0]===state.view?'aria-current="page"':''}>${n[1]}${badgeFor(n[0])}</button>`).join('');
  document.getElementById('app').innerHTML=VIEWS[state.view]();
  const cf=document.getElementById('cForm');
  if(cf){const w=document.getElementById('cBudgetWrap');cf.addEventListener('change',()=>{w.hidden=cf.querySelector('input[name=cMode]:checked').value!=='managed'});}
  state.sel=null;
}
['reseller','sales','admin'].forEach(r=>document.getElementById('role-'+r).onclick=()=>setRole(r));

const FIRST=['Akua','Kofi','Esi','Yaa','Kwabena','Naana','Selorm','Fatima'],LAST=['Owusu','Mensah','Tagoe','Abdul','Nyarko','Adomako','Amoah','Lartey'],PLACES=[['Greater Accra','Accra'],['Ashanti','Kumasi'],['Northern','Tamale'],['Western','Takoradi'],['Volta','Ho'],['Upper East','Bolgatanga'],['Bono','Sunyani']];
document.addEventListener('click',e=>{
  const g=e.target.closest('[data-go]');if(g){go(g.dataset.go);return}
  const f=e.target.closest('[data-filter]');if(f){state.filter=f.dataset.filter;draw();return}
  const a=e.target.closest('[data-act]');if(!a)return;
  const id=a.dataset.id,o=state.orders.find(x=>x.id===id);
  switch(a.dataset.act){
    case 'advertise':state.sel=id;state.view='campaigns';draw();window.scrollTo(0,0);break;
    case 'copy':{const t=prod(id).cap;(navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).then(()=>toast('Caption copied')).catch(()=>toast('Caption: '+t));break}
    case 'confirm':{
      const ad=document.getElementById('addr-'+id).value.trim();
      if(!ad){toast('Enter the delivery address first');return}
      o.address=ad;o.paid=document.getElementById('fee-'+id).checked;o.status='confirmed';o.hrs=0;o.ago=0;
      toast(id+' confirmed. Delivery clock started: 24h.');draw();break}
    case 'noanswer':o.tries++;toast('Attempt '+o.tries+' logged for '+o.name+(o.tries>=3?'. Consider closing this lead.':''));draw();break;
    case 'decline':o.status='cancelled';toast(id+' closed as declined');draw();break;
    case 'simulate':{
      const rc=state.campaigns.filter(c=>c.status==='running'),c=rc[Math.floor(Math.random()*rc.length)],pl=PLACES[Math.floor(Math.random()*PLACES.length)];
      const n=O(c.rid,c.pid,1+Math.floor(Math.random()*2),FIRST[Math.floor(Math.random()*8)]+' '+LAST[Math.floor(Math.random()*8)],'024 '+String(100+Math.floor(Math.random()*899))+' '+String(1000+Math.floor(Math.random()*8999)),pl[0],pl[1],'new',0,0,{wait:1});
      state.orders.unshift(n);toast('New order from '+res(c.rid).name+'\'s ad: '+prod(c.pid).name);draw();break}
    case 'dispatch':o.status='out';toast(id+' is out for delivery');draw();break;
    case 'delivered':o.status='delivered';toast(id+' delivered in '+o.hrs+'h. '+money(comm(o))+' credited to '+res(o.rid).name);draw();break;
    case 'failed':o.status='failed';toast(id+' failed. Commitment fee kept for logistics.');draw();break;
    case 'skip':state.orders.filter(x=>OPEN.includes(x.status)).forEach(x=>x.hrs+=6);toast('Clock moved 6 hours. Check the Due soon and Late tags.');draw();break;
    case 'launch':{const c=state.campaigns.find(x=>x.id===id);c.status='running';toast('Campaign running for '+res(c.rid).name);draw();break}
    case 'pausec':{const c=state.campaigns.find(x=>x.id===id);c.status='paused';toast('Campaign paused');draw();break}
    case 'approve':res(id).status='active';toast(res(id).name+' approved');draw();break;
    case 'runpay':{
      let n=0,tot=0;RESELLERS.forEach(r=>{const u=unsettled(r.id);if(u.length){const amt=u.reduce((s,x)=>s+comm(x),0);state.payouts.push({id:'P-'+Date.now()+r.id,rid:r.id,week:NEXT_FRI,amt,n:u.length});u.forEach(x=>x.settled=true);n++;tot+=amt}});
      toast('Paid '+money(tot)+' to '+n+' reseller'+(n===1?'':'s'));draw();break}
  }
});
document.addEventListener('submit',e=>{
  if(e.target.id==='cForm'){
    e.preventDefault();
    const pid=document.getElementById('cProd').value,mode=e.target.querySelector('input[name=cMode]:checked').value,bud=+document.getElementById('cBudget').value;
    if(mode==='managed'&&!(bud>=20)){toast('Daily budget must be at least GH₵20');return}
    state.campaigns.unshift({id:'c'+(state.campaigns.length+1),rid:ME,pid,mode,budget:mode==='managed'?bud:0,spent:0,status:mode==='managed'?'pending':'running'});
    toast(mode==='managed'?'Request sent. Our team will launch it within 24 hours.':'Campaign created. Your tracking link is in the table.');draw();
  }
});
const h=(location.hash||'').slice(1);if(NAV.reseller.some(n=>n[0]===h))state.view=h;
draw();
</script>

</body></html>
